# Hot Wheels Collection Tracker — NAS stack.
#
#   cp .env.example .env    # then fill in the two CHANGE_ME values
#   docker compose up -d
#
# Open the frontend service in a browser (FRONTEND_PORT, default 18080). The
# backend port serves the API only and has no page at /.
#
# Deploy from the NAS Docker UI or the command line — either is fine, as long as
# both point at *this* file and agree on the project name. The explicit `name:`
# below is what makes that work: without it the project name gets derived from
# whichever directory or UI form the stack was created from, and the two end up
# managing separate copies of the same stack.
#
# Data lives in two named volumes, pgdata and car-images. Those are the only
# things that matter for backups — see migration/backup.sh.

name: hotwheels

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotwheels}
      POSTGRES_USER: ${POSTGRES_USER:-hotwheels}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, only when pgdata is empty — creates the tables on first boot.
      - ./migration/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # Not published to the LAN by default: only the backend container needs it.
    # Uncomment to run the import script or psql from your laptop.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotwheels} -d ${POSTGRES_DB:-hotwheels}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotwheels}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hotwheels}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      TOKEN_TTL_DAYS: ${TOKEN_TTL_DAYS:-30}
      IMAGE_DIR: /data/car-images
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - car-images:/data/car-images
    ports:
      # Only needed for direct API access and debugging — the app itself reaches
      # the backend through the frontend container's proxy.
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # This is the one you open in a browser. Serves the built React app and
  # proxies /api and /images to the backend, so everything is one origin.
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-18080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  car-images:
