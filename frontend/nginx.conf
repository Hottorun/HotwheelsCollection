server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Car photos can be a few MB; the backend caps uploads at 5 MB.
    client_max_body_size 10m;

    # API and images go to the backend container. Because the browser sees them
    # on the same origin as the page, there is no CORS involved at all.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Wiki scraping and barcode lookups reach out to slow third-party sites.
        proxy_read_timeout 120s;
    }

    location /images/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Images are content-addressed by car UUID and replaced wholesale on
        # re-upload, so they are safe to cache hard in the browser.
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        # Vite fingerprints these filenames, so they can never go stale.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: React Router owns the routing, so any unknown path must
    # still return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
